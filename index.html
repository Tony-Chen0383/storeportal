<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Mobile 創宇數位｜門市工具整合平台</title>
<style>
:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#6b7280;
  --line:#e5eaf0;
  --primary:#143b6b;
  --primary2:#1f5f9f;
  --soft:#eef4fa;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.topbar{
  background:#fff;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:20;
}
.topbar-inner{
  max-width:1280px;
  margin:auto;
  padding:14px 24px;
  display:flex;
  align-items:center;
  gap:16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
}
.brand img{
  width:72px;
  height:72px;
  object-fit:contain;
  border-radius:12px;
  background:#fff;
}
.brand-title{
  font-size:22px;
  font-weight:900;
}
.brand-sub{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}
.search{
  margin-left:auto;
  max-width:420px;
  width:100%;
}
.search input{
  width:100%;
  height:46px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:0 15px;
  font-size:15px;
  outline:none;
  background:#f8fafc;
}
.search input:focus{
  background:#fff;
  border-color:#adc3db;
  box-shadow:0 0 0 4px rgba(31,95,159,.08);
}
.page{
  max-width:1280px;
  margin:auto;
  padding:28px 24px 48px;
}
.hero{
  background:linear-gradient(135deg,#102f56,#1b5f98);
  color:#fff;
  border-radius:24px;
  padding:32px 36px;
  box-shadow:0 18px 40px rgba(20,59,107,.15);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}
.hero-text h1{
  margin:0 0 10px;
  font-size:30px;
}
.hero-text p{
  margin:0;
  color:rgba(255,255,255,.84);
  line-height:1.8;
}
.hero-badge{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  padding:18px 22px;
  min-width:180px;
  text-align:center;
}
.hero-badge strong{
  display:block;
  font-size:42px;
  line-height:1;
}
.hero-badge span{
  display:block;
  margin-top:6px;
  font-size:13px;
  color:rgba(255,255,255,.8);
}
.notice{
  margin-top:18px;
  background:#fff7e3;
  border:1px solid #f0dfab;
  border-radius:18px;
  padding:16px 18px;
  display:flex;
  gap:14px;
  align-items:flex-start;
  box-shadow:0 8px 20px rgba(20,59,107,.05);
}
.notice-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#ffe7a7;
  display:grid;
  place-items:center;
  font-size:19px;
  flex:0 0 auto;
}
.notice-title{
  font-size:15px;
  font-weight:900;
  margin-bottom:4px;
  color:#6e5303;
}
.notice-text{
  font-size:13px;
  color:#6b5c2b;
  line-height:1.7;
}
.section-title{
  font-size:20px;
  font-weight:900;
  margin:28px 0 14px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 28px rgba(20,59,107,.07);
  display:flex;
  flex-direction:column;
  min-height:255px;
  transition:.2s;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 16px 34px rgba(20,59,107,.12);
}
.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.icon{
  width:56px;
  height:56px;
  border-radius:16px;
  background:var(--soft);
  display:grid;
  place-items:center;
  font-size:26px;
  border:1px solid #dde7f2;
}
.label{
  font-size:11px;
  font-weight:800;
  color:#7a5a00;
  background:#fff6d5;
  border:1px solid #f0dc97;
  padding:6px 10px;
  border-radius:999px;
  white-space:nowrap;
}
.name{
  font-size:18px;
  font-weight:900;
  margin:16px 0 8px;
  line-height:1.35;
}
.desc{
  font-size:13px;
  line-height:1.75;
  color:var(--muted);
  flex:1;
  margin:0;
}
.meta{
  margin-top:14px;
  padding-top:12px;
  border-top:1px dashed #d8e0ea;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  color:#7c8798;
  font-size:12px;
}
.meta .date{
  font-weight:700;
}
.btn{
  display:inline-block;
  margin-top:16px;
  background:var(--primary);
  color:#fff;
  text-decoration:none;
  font-weight:800;
  padding:10px 14px;
  border-radius:11px;
  text-align:center;
}
.footer{
  margin-top:38px;
  border-top:1px solid var(--line);
  padding-top:18px;
  color:#8a94a5;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.empty{
  display:none;
  background:#fff;
  border:1px dashed #ccd5df;
  border-radius:16px;
  padding:28px;
  text-align:center;
  color:var(--muted);
  margin-top:16px;
}
@media(max-width:1000px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:720px){
  .topbar-inner{flex-wrap:wrap}
  .search{max-width:none}
  .hero{flex-direction:column;align-items:flex-start}
}
@media(max-width:600px){
  .page{padding:20px 16px}
  .grid{grid-template-columns:1fr}
  .hero{padding:26px 22px}
  .hero-text h1{font-size:25px}
  .brand img{width:60px;height:60px}
}
</style>
</head>
